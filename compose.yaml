services:
  backend:
    profiles: [backend]
    build: .
    image: ai-gym-coach:local
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    environment:
      APP_ENV: development
      ENABLE_DEMO_AUTH: ${ENABLE_DEMO_AUTH:-false}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  migrate:
    profiles: [backend]
    build: .
    image: ai-gym-coach:local
    command: [python, -m, app.db.migrate]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      APP_ENV: development
      MIGRATION_DATABASE_URL: ${CONTAINER_MIGRATION_DATABASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: gym_coach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_coach"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
