[project]
name = "ai-gym-coach"
version = "0.1.0"
description = "An AI-powered workout logging and progress analysis assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
