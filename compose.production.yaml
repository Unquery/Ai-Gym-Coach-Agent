# Managed PostgreSQL only. Runtime and release credentials stay separate.
services:
  backend:
    build: .
    image: ai-gym-coach:production
    init: true
    restart: unless-stopped
    stop_grace_period: 120s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      ENABLE_DEMO_AUTH: "false"
      DATABASE_URL: ${DATABASE_URL:-}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      API_OWNER_ID: ${API_OWNER_ID:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-16384}
      CHAT_REQUESTS_PER_MINUTE: ${CHAT_REQUESTS_PER_MINUTE:-10}
      API_REQUESTS_PER_MINUTE: ${API_REQUESTS_PER_MINUTE:-120}
      LOG_LEVEL: INFO
  migrate:
    profiles: [release]
    build: .
    image: ai-gym-coach:production
    command: [python, -m, app.db.migrate]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      APP_ENV: production
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
